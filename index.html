<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Morpion à enchères</title>
<style>
  :root {
    --red: #f43f5e;
    --red-dark: #be123c;
    --red-light: #ff8fa3;
    --blue: #3b82f6;
    --blue-dark: #1d4ed8;
    --blue-light: #93c5fd;
    --green: #10b981;
    --purple: #a855f7;
    --orange: #f59e0b;
    --yellow: #facc15;
    --yellow-dark: #b45309;

    --bg-0: #05060a;
    --panel: rgba(20, 24, 38, 0.72);
    --panel-solid: #141826;
    --panel-2: #1c2235;
    --panel-hover: #232a41;

    --text: #f5f7ff;
    --text-dim: #a8afc5;
    --muted: #6b7391;
    --border: rgba(255, 255, 255, 0.06);
    --border-strong: rgba(255, 255, 255, 0.12);

    --radius: 18px;
    --radius-sm: 12px;
    --radius-lg: 26px;

    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.35);
    --shadow-lg: 0 20px 48px rgba(0,0,0,0.5);
    --glow-red: 0 0 24px rgba(244,63,94,0.5);
    --glow-blue: 0 0 24px rgba(59,130,246,0.5);
    --glow-white: 0 0 24px rgba(255,255,255,0.35);
    --glow-yellow: 0 0 16px rgba(250,204,21,0.6);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg-0);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
    user-select: none;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1200px 800px at 20% -10%, rgba(99,102,241,0.18), transparent 60%),
      radial-gradient(900px 700px at 100% 100%, rgba(236,72,153,0.14), transparent 55%),
      radial-gradient(700px 500px at 0% 100%, rgba(59,130,246,0.12), transparent 60%),
      var(--bg-0);
  }

  #app {
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* ========== MEEPLES SVG ========== */
  .meeple {
    width: 26px;
    height: 26px;
    display: block;
    flex-shrink: 0;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5));
  }

  /* ========== SCREENS ========== */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
    overflow-y: auto;
    opacity: 0;
    transform: translateX(24px) scale(0.99);
    transition: opacity 0.3s cubic-bezier(0.4,0,0.2,1),
                transform 0.3s cubic-bezier(0.4,0,0.2,1);
    pointer-events: none;
  }
  .screen.active {
    opacity: 1;
    transform: translateX(0) scale(1);
    pointer-events: auto;
  }
  .screen.leaving { opacity: 0; transform: translateX(-24px) scale(0.99); }

  /* ========== MENU ========== */
  #menu {
    justify-content: center;
    gap: 28px;
    padding: 40px 24px;
  }

  .logo {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .logo .dots {
    display: flex;
    gap: 14px;
    margin-bottom: 14px;
    align-items: flex-end;
  }

  .logo .dots .meeple {
    width: 44px;
    height: 44px;
    filter: drop-shadow(0 0 14px rgba(244,63,94,0.6));
    animation: float 3s ease-in-out infinite;
  }

  .logo .dots .meeple.blue {
    filter: drop-shadow(0 0 14px rgba(59,130,246,0.6));
    animation-delay: 0.4s;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .logo h1 {
    margin: 0;
    font-size: 48px;
    font-weight: 900;
    letter-spacing: -1.5px;
    background: linear-gradient(135deg, #fff 0%, #c9d1ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  .logo p {
    margin: 0;
    color: var(--text-dim);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .menu-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
    text-align: left;
    font-family: inherit;
    color: inherit;
    font-size: 1rem;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  .menu-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.06), transparent 60%);
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }

  .menu-btn:hover {
    background: var(--panel-hover);
    border-color: var(--border-strong);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .menu-btn:hover::before { opacity: 1; }
  .menu-btn:active { transform: translateY(0) scale(0.98); }

  .menu-btn .icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2),
                0 4px 12px rgba(0,0,0,0.3);
  }

  .menu-btn .icon.ai     { background: linear-gradient(135deg, #60a5fa, #2563eb); }
  .menu-btn .icon.friend { background: linear-gradient(135deg, #c084fc, #7c3aed); }
  .menu-btn .icon.stats  { background: linear-gradient(135deg, #fbbf24, #d97706); }

  .menu-btn .text {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .menu-btn .title { font-weight: 700; font-size: 16px; letter-spacing: -0.2px; }
  .menu-btn .subtitle { font-size: 13px; color: var(--text-dim); }

  .menu-btn .chev {
    color: var(--muted);
    font-size: 18px;
    transition: transform 0.2s;
  }

  .menu-btn:hover .chev { color: var(--text); transform: translateX(3px); }

  /* ========== TOPBAR ========== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding: 0 4px;
  }

  .topbar .back {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 7px 12px;
    font-family: inherit;
    border-radius: 10px;
    transition: all 0.15s;
  }

  .topbar .back:hover {
    background: rgba(255,255,255,0.1);
    border-color: var(--border-strong);
  }

  .topbar .back:active { transform: scale(0.95); }

  .topbar .mode-label {
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .topbar .refresh {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    padding: 7px 10px;
    border-radius: 10px;
    transition: all 0.15s;
    line-height: 1;
  }

  .topbar .refresh:hover {
    background: rgba(255,255,255,0.1);
    border-color: var(--border-strong);
    transform: rotate(45deg);
  }

  .topbar .refresh:active { transform: rotate(45deg) scale(0.9); }

  /* ========== SETTINGS ========== */
  .settings {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .segmented {
    display: inline-flex;
    background: rgba(20, 24, 38, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    gap: 3px;
    box-shadow: var(--shadow-sm);
  }

  .segmented button {
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 7px 16px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    letter-spacing: -0.1px;
  }

  .segmented button:hover { color: var(--text); }

  .segmented button.active {
    color: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25),
                inset 0 1px 0 rgba(255,255,255,0.2);
  }

  #level-picker button.active {
    background: linear-gradient(135deg, #c084fc, #7c3aed);
  }

  #difficulty-picker button.active {
    background: linear-gradient(135deg, #60a5fa, #2563eb);
  }

  /* ========== PLAYERS ========== */
  .players {
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 16px;
  }

  .badge {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.5px solid var(--border);
    min-width: 100px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .badge::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08), transparent 70%);
    pointer-events: none;
  }

  .badge.red.active {
    border-color: rgba(244,63,94,0.6);
    background: linear-gradient(180deg, rgba(244,63,94,0.2), rgba(244,63,94,0.05));
    box-shadow: var(--glow-red);
  }

  .badge.blue.active {
    border-color: rgba(59,130,246,0.6);
    background: linear-gradient(180deg, rgba(59,130,246,0.2), rgba(59,130,246,0.05));
    box-shadow: var(--glow-blue);
  }

  .badge .row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: -0.1px;
  }

  .badge .row .meeple {
    width: 22px;
    height: 22px;
  }

  .badge .stock {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .badge.right { text-align: right; }
  .badge.right .row { justify-content: flex-end; }

  .status {
    flex: 1;
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: -0.2px;
  }

  .status.red { color: var(--red); }
  .status.blue { color: var(--blue); }
  .status.thinking { color: var(--blue); }
  .status.thinking::after {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--blue);
    margin-left: 8px;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* ========== BOARD ========== */
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    aspect-ratio: 1;
    max-width: 400px;
    width: 100%;
    margin: 0 auto;
    flex-shrink: 0;
    padding: 4px;
    border-radius: var(--radius-lg);
    background: rgba(10, 12, 22, 0.5);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.3);
  }

  .cell {
    position: relative;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(28, 34, 53, 0.9), rgba(20, 24, 38, 0.9));
    border: 1.5px solid var(--border);
    padding: 6px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
    overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05),
                0 4px 12px rgba(0,0,0,0.25);
  }

  .cell::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08), transparent 60%);
    pointer-events: none;
    opacity: 0.7;
  }

  .cell.owned-red {
    background: linear-gradient(180deg, rgba(244,63,94,0.22), rgba(244,63,94,0.06));
    border-color: rgba(244,63,94,0.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08),
                0 4px 16px rgba(244,63,94,0.25);
  }

  .cell.owned-blue {
    background: linear-gradient(180deg, rgba(59,130,246,0.22), rgba(59,130,246,0.06));
    border-color: rgba(59,130,246,0.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08),
                0 4px 16px rgba(59,130,246,0.25);
  }

  .cell.selected {
    border-color: #fff;
    border-width: 2.5px;
    transform: scale(1.03);
    z-index: 2;
    box-shadow: var(--glow-white),
                inset 0 1px 0 rgba(255,255,255,0.2);
  }

  .cell.disabled {
    opacity: 0.3;
    cursor: not-allowed;
    filter: grayscale(0.5);
  }

  .cell:not(.disabled):not(.selected):hover {
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }

  .cell:not(.disabled):not(.selected):active {
    transform: scale(0.97);
  }

  .cell.winning {
    animation: winPulse 1.6s ease-in-out infinite;
  }

  @keyframes winPulse {
    0%, 100% {
      box-shadow: 0 0 0 2px rgba(250,204,21,0.6),
                  0 0 24px rgba(250,204,21,0.5),
                  inset 0 1px 0 rgba(255,255,255,0.15);
    }
    50% {
      box-shadow: 0 0 0 3px rgba(250,204,21,0.9),
                  0 0 40px rgba(250,204,21,0.8),
                  inset 0 1px 0 rgba(255,255,255,0.25);
    }
  }

  .pawn-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 2px;
    min-height: 28px;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
  }

  .pawn-count {
    font-size: 16px;
    font-weight: 800;
    line-height: 1;
    margin-left: 3px;
    font-variant-numeric: tabular-nums;
  }

  .pawn-count.red { color: var(--red-light); text-shadow: 0 0 10px rgba(244,63,94,0.7); }
  .pawn-count.blue { color: var(--blue-light); text-shadow: 0 0 10px rgba(59,130,246,0.7); }

  /* ========== BADGES DE CASE ========== */

  .cost-badge {
    position: absolute;
    top: 5px;
    right: 5px;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: white;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.14);
    z-index: 3;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.2px;
  }

  /* Filigrane de contrainte : grand chiffre transparent sur toute la case */
  .min-badge {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 0;
    color: rgba(250, 204, 21, 0.15);
    font-size: 96px;
    font-weight: 900;
    line-height: 0.85;
    font-variant-numeric: tabular-nums;
    letter-spacing: -4px;
    text-shadow: 0 0 30px rgba(250, 204, 21, 0.22);
    user-select: none;
    overflow: hidden;
  }

  .min-badge::after {
    content: 'minimum';
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(250, 204, 21, 0.55);
    text-shadow: 0 1px 2px rgba(0,0,0,0.9);
    white-space: nowrap;
  }

  /* ========== BOTTOM PANEL ========== */
  .bottom {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 0 8px;
    min-height: 150px;
  }

  .panel-content {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow-md);
    position: relative;
    overflow: hidden;
  }

  .panel-content::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  }

  .panel-msg {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 500;
    padding: 16px 0;
  }

  .panel-desc {
    text-align: center;
    font-size: 13px;
    line-height: 1.45;
    color: var(--text);
    font-weight: 500;
  }

  .counter {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }

  .counter button {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(180deg, var(--panel-2), rgba(20,24,38,0.9));
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1),
                0 2px 8px rgba(0,0,0,0.3);
  }

  .counter button:not(:disabled):hover {
    background: linear-gradient(180deg, var(--panel-hover), var(--panel-2));
    border-color: rgba(255,255,255,0.2);
    transform: scale(1.05);
  }

  .counter button:not(:disabled):active { transform: scale(0.92); }
  .counter button:disabled { opacity: 0.25; cursor: not-allowed; }

  .counter .value {
    font-size: 32px;
    font-weight: 800;
    min-width: 52px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #fff, #a8afc5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .actions { display: flex; gap: 10px; }

  .actions button {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: all 0.15s;
    letter-spacing: -0.2px;
  }

  .actions button:active { transform: scale(0.97); }

  .btn-cancel {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border: 1px solid var(--border-strong) !important;
  }

  .btn-cancel:hover { background: rgba(255,255,255,0.1); }

  .btn-confirm {
    background: linear-gradient(135deg, #ff6b81, var(--red));
    color: white;
    box-shadow: 0 4px 16px rgba(244,63,94,0.4),
                inset 0 1px 0 rgba(255,255,255,0.2);
  }

  .btn-confirm.blue {
    background: linear-gradient(135deg, #60a5fa, var(--blue));
    box-shadow: 0 4px 16px rgba(59,130,246,0.4),
                inset 0 1px 0 rgba(255,255,255,0.2);
  }

  .btn-confirm:hover { filter: brightness(1.1); }

  .btn-primary {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    background: linear-gradient(135deg, #fff, #dbe0ff);
    color: #0b0d16;
    font-weight: 800;
    font-size: 15px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    box-shadow: 0 8px 24px rgba(255,255,255,0.15),
                inset 0 1px 0 rgba(255,255,255,0.8);
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 32px rgba(255,255,255,0.2),
                inset 0 1px 0 rgba(255,255,255,0.8);
  }

  .btn-primary:active { transform: scale(0.98); }

  /* ========== STATS FOOTER ========== */
  .stats-footer {
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 11px;
    color: var(--text-dim);
    padding: 8px 0 0;
    font-weight: 500;
  }

  .stats-footer .item { display: flex; align-items: center; gap: 5px; }
  .stats-footer .val {
    font-weight: 800;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

<script>
// ============================================================
// CONFIG — NIVEAUX
// ============================================================
const LEVELS = {
  1: {
    name: "Niveau 1",
    startingPawns: 7,
    minPlacements: {}
  },
  2: {
    name: "Niveau 2",
    startingPawns: 9,
    minPlacements: { 3: 2, 4: 3 }
  }
};

const LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

const DIFFICULTY_DEPTH = { easy: 1, medium: 3, hard: 5 };

// Chemin SVG du meeple
const MEEPLE_PATH = "M12 1.5C9.5 1.5 7.5 3.5 7.5 6C7.5 7.7 8.4 9.2 9.7 10.1L7.5 11L3 11L3 14L7.5 14L7.5 16.5L6.5 16.5L6.5 22.5L10 22.5L10 17.5L14 17.5L14 22.5L17.5 22.5L17.5 16.5L16.5 16.5L16.5 14L21 14L21 11L16.5 11L14.3 10.1C15.6 9.2 16.5 7.7 16.5 6C16.5 3.5 14.5 1.5 12 1.5Z";

function meepleSVG(color, extraClass = '') {
  const grad = color === 'red' ? 'meeple-red-grad' : 'meeple-blue-grad';
  return `<svg class="meeple ${color} ${extraClass}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path fill="url(#${grad})" d="${MEEPLE_PATH}"/>
  </svg>`;
}

// ============================================================
// STATS
// ============================================================
const Stats = {
  load() {
    return {
      wins: parseInt(localStorage.getItem('morpion_wins') || '0'),
      losses: parseInt(localStorage.getItem('morpion_losses') || '0'),
      draws: parseInt(localStorage.getItem('morpion_draws') || '0'),
    };
  },
  save(s) {
    localStorage.setItem('morpion_wins', s.wins);
    localStorage.setItem('morpion_losses', s.losses);
    localStorage.setItem('morpion_draws', s.draws);
  },
  reset() { this.save({ wins: 0, losses: 0, draws: 0 }); }
};

// ============================================================
// STATE
// ============================================================
let game = null;
let currentScreen = 'menu';

function newGame(vsAI, level = 1) {
  const levelCfg = LEVELS[level];
  return {
    board: Array.from({ length: 9 }, () => ({ red: 0, blue: 0 })),
    current: 'red',
    stock: { red: levelCfg.startingPawns, blue: levelCfg.startingPawns },
    winner: null,
    isDraw: false,
    selected: null,
    pending: 1,
    vsAI: vsAI,
    difficulty: 'medium',
    level: level,
    statsRecorded: false,
    winningLine: null,
  };
}

// ============================================================
// HELPERS
// ============================================================
const other = p => p === 'red' ? 'blue' : 'red';
const cellCount = (c, p) => p === 'red' ? c.red : c.blue;

function cellOwner(c) {
  if (c.red > c.blue) return 'red';
  if (c.blue > c.red) return 'blue';
  return null;
}

function baseCost(cell, player) {
  const mine = cellCount(cell, player);
  const theirs = cellCount(cell, other(player));
  if (mine > theirs) return 1;
  return theirs - mine + 1;
}

function minCost(index, player, level) {
  const cell = game.board[index];
  const base = baseCost(cell, player);
  const minPlace = LEVELS[level].minPlacements[index] || 1;
  return Math.max(base, minPlace);
}

function minCostForState(cell, player, minPlace) {
  const base = baseCost(cell, player);
  return Math.max(base, minPlace || 1);
}

function currentStock() { return game.stock[game.current]; }
function isGameOver() { return game.winner !== null || game.isDraw; }
function isAITurn() { return game.vsAI && game.current === 'blue' && !isGameOver(); }

// ============================================================
// APPLY MOVE
// ============================================================
function applyMove(index, count) {
  if (isGameOver()) return;
  const c = game.board[index];
  const player = game.current;
  const opp = other(player);
  const cost = minCost(index, player, game.level);
  if (count < cost || count > game.stock[player]) return;

  if (cellOwner(c) === opp) {
    game.stock[opp] += cellCount(c, opp);
    if (opp === 'red') c.red = 0; else c.blue = 0;
  }

  if (player === 'red') c.red += count; else c.blue += count;
  game.stock[player] -= count;

  for (const line of LINES) {
    const owner = cellOwner(game.board[line[0]]);
    if (owner && line.every(i => cellOwner(game.board[i]) === owner)) {
      game.winner = owner;
      game.winningLine = line;
      break;
    }
  }

  if (!game.winner) {
    let next = opp;
    if (game.stock[next] === 0 && game.stock[player] !== 0) next = player;
    game.current = next;
    if (game.stock.red === 0 && game.stock.blue === 0) game.isDraw = true;
  }

  game.selected = null;
  game.pending = 1;
}

// ============================================================
// IA
// ============================================================
function aiStateFromGame() {
  return {
    board: game.board.map(c => ({ ...c })),
    current: game.current,
    stock: { ...game.stock },
    level: game.level
  };
}

function stateWinner(s) {
  for (const line of LINES) {
    const o = cellOwner(s.board[line[0]]);
    if (o && line.every(i => cellOwner(s.board[i]) === o)) return o;
  }
  return null;
}

function legalMoves(s) {
  const moves = [];
  const max = s.stock[s.current];
  if (max <= 0) return moves;
  const constraints = LEVELS[s.level].minPlacements;
  for (let i = 0; i < 9; i++) {
    const c = minCostForState(s.board[i], s.current, constraints[i]);
    if (c <= max) moves.push({ cell: i, count: c });
  }
  return moves;
}

function applyMoveToState(s, cell, count) {
  const ns = {
    board: s.board.map(c => ({ ...c })),
    current: s.current,
    stock: { ...s.stock },
    level: s.level
  };
  const player = s.current;
  const opp = other(player);
  const c = ns.board[cell];

  if (cellOwner(c) === opp) {
    ns.stock[opp] += cellCount(c, opp);
    if (opp === 'red') c.red = 0; else c.blue = 0;
  }
  if (player === 'red') c.red += count; else c.blue += count;
  ns.stock[player] -= count;

  let next = opp;
  if (ns.stock[next] === 0 && ns.stock[player] !== 0) next = player;
  ns.current = next;
  return ns;
}

function evaluate(s, player) {
  const w = stateWinner(s);
  if (w) return w === player ? 1_000_000 : -1_000_000;
  if (s.stock.red === 0 && s.stock.blue === 0) return 0;

  const opp = other(player);
  let score = 0;

  score += (s.stock[player] - s.stock[opp]) * 40;

  for (const c of s.board) {
    const o = cellOwner(c);
    if (o === player) score += 20;
    else if (o === opp) score -= 20;
  }

  for (const line of LINES) {
    let mine = 0, theirs = 0;
    for (const i of line) {
      const o = cellOwner(s.board[i]);
      if (o === player) mine++;
      else if (o === opp) theirs++;
    }
    if (theirs === 0) {
      if (mine === 2) score += 180;
      else if (mine === 1) score += 8;
    }
    if (mine === 0) {
      if (theirs === 2) score -= 180;
      else if (theirs === 1) score -= 8;
    }
  }

  if (legalMoves(s).length === 0) {
    score += (s.current === player) ? -500 : 500;
  }

  return score;
}

function minimax(s, depth, alpha, beta, aiPlayer) {
  const w = stateWinner(s);
  const isDraw = s.stock.red === 0 && s.stock.blue === 0;
  if (depth === 0 || w || isDraw) return evaluate(s, aiPlayer);

  const moves = legalMoves(s);
  if (moves.length === 0) return evaluate(s, aiPlayer);

  const isMax = s.current === aiPlayer;

  if (isMax) {
    let value = -Infinity;
    for (const m of moves) {
      const ns = applyMoveToState(s, m.cell, m.count);
      value = Math.max(value, minimax(ns, depth - 1, alpha, beta, aiPlayer));
      alpha = Math.max(alpha, value);
      if (alpha >= beta) break;
    }
    return value;
  } else {
    let value = Infinity;
    for (const m of moves) {
      const ns = applyMoveToState(s, m.cell, m.count);
      value = Math.min(value, minimax(ns, depth - 1, alpha, beta, aiPlayer));
      beta = Math.min(beta, value);
      if (alpha >= beta) break;
    }
    return value;
  }
}

function aiChooseMove() {
  const s = aiStateFromGame();
  const moves = legalMoves(s);
  if (moves.length === 0) return null;

  if (game.difficulty === 'easy' && Math.random() < 0.5) {
    return moves[Math.floor(Math.random() * moves.length)];
  }

  const depth = DIFFICULTY_DEPTH[game.difficulty];
  const aiPlayer = s.current;
  let bestScore = -Infinity;
  let bestMoves = [];

  for (const m of moves) {
    const ns = applyMoveToState(s, m.cell, m.count);
    const sc = minimax(ns, depth - 1, -Infinity, Infinity, aiPlayer);
    if (sc > bestScore) {
      bestScore = sc;
      bestMoves = [m];
    } else if (sc === bestScore) {
      bestMoves.push(m);
    }
  }
  return bestMoves[Math.floor(Math.random() * bestMoves.length)] || moves[0];
}

// ============================================================
// ANIMATIONS
// ============================================================
function spawnFlyingPawns(index, count, player) {
  const startEl = document.getElementById('badge-' + player);
  const cells = document.querySelectorAll('.cell');
  const endEl = cells[index];
  if (!startEl || !endEl) return;

  const appRect = document.getElementById('app').getBoundingClientRect();
  const sRect = startEl.getBoundingClientRect();
  const eRect = endEl.getBoundingClientRect();

  const sx = sRect.left - appRect.left + sRect.width / 2 - 17;
  const sy = sRect.top - appRect.top + sRect.height / 2 - 17;
  const ex = eRect.left - appRect.left + eRect.width / 2 - 17;
  const ey = eRect.top - appRect.top + eRect.height / 2 - 17;

  const visualCount = Math.min(count, 6);
  for (let i = 0; i < visualCount; i++) {
    const pawn = document.createElement('div');
    pawn.className = 'flying-pawn';
    pawn.innerHTML = meepleSVG(player);
    pawn.style.left = sx + 'px';
    pawn.style.top = sy + 'px';
    document.getElementById('app').appendChild(pawn);
    void pawn.offsetWidth;

    const delay = i * 45;
    const rotDirection = (i % 2 === 0) ? 1 : -1;
    setTimeout(() => {
      pawn.style.left = ex + 'px';
      pawn.style.top = ey + 'px';
      pawn.style.transform = `rotate(${rotDirection * 25}deg) scale(0.75)`;
      pawn.style.opacity = '0';
    }, delay);
    setTimeout(() => pawn.remove(), delay + 900);
  }
}

function showWinOverlay(player) {
  const overlay = document.getElementById('win-overlay');
  const text = document.getElementById('win-text');
  text.className = 'win-text ' + player;
  text.textContent = player === 'red' ? 'ROUGE !' : (game.vsAI ? 'IA !' : 'BLEU !');
  overlay.classList.add('show');
  setTimeout(() => overlay.classList.remove('show'), 1400);
}

// ============================================================
// RENDER
// ============================================================
function renderPawns(count, color) {
  if (count === 0) return '<div class="pawn-row"></div>';
  if (count <= 3) {
    let html = '<div class="pawn-row">';
    for (let i = 0; i < count; i++) html += meepleSVG(color);
    html += '</div>';
    return html;
  }
  return `<div class="pawn-row">${meepleSVG(color)}<span class="pawn-count ${color}">×${count}</span></div>`;
}

function renderGame() {
  if (!game) return;

  document.getElementById('stock-red').textContent =
    game.stock.red + ' pion' + (game.stock.red > 1 ? 's' : '');
  document.getElementById('stock-blue').textContent =
    game.stock.blue + ' pion' + (game.stock.blue > 1 ? 's' : '');
  document.getElementById('label-red').textContent = 'Rouge';
  document.getElementById('label-blue').textContent = game.vsAI ? 'IA' : 'Bleu';

  document.getElementById('badge-red').classList.toggle(
    'active', game.current === 'red' && !isGameOver());
  document.getElementById('badge-blue').classList.toggle(
    'active', game.current === 'blue' && !isGameOver());

  const status = document.getElementById('status');
  status.className = 'status';
  if (isGameOver()) {
    if (game.winner) {
      status.textContent = (game.winner === 'red' ? 'Rouge' : (game.vsAI ? 'IA' : 'Bleu')) + ' gagne !';
      status.classList.add(game.winner);
    } else {
      status.textContent = 'Match nul';
    }
  } else if (isAITurn()) {
    status.textContent = "L'IA réfléchit";
    status.classList.add('thinking');
  } else {
    status.textContent = 'Tour du ' + (game.current === 'red' ? 'rouge' : (game.vsAI ? 'IA' : 'bleu'));
    status.classList.add(game.current);
  }

  const board = document.getElementById('board');
  const constraints = LEVELS[game.level].minPlacements;
  const winningLine = game.winningLine || [];
  let html = '';
  for (let i = 0; i < 9; i++) {
    const c = game.board[i];
    const owner = cellOwner(c);
    const cost = minCost(i, game.current, game.level);
    const canPlay = !isGameOver() && !isAITurn() && cost <= currentStock();
    const isSelected = game.selected === i;

    let cls = 'cell';
    if (owner) cls += ' owned-' + owner;
    if (isSelected) cls += ' selected';
    if (!canPlay && !isSelected) cls += ' disabled';
    if (winningLine.includes(i)) cls += ' winning';

    let costBadge = '';
    if (!isGameOver() && owner && owner !== game.current && cost > 1 && !isSelected) {
      costBadge = `<div class="cost-badge">≥${cost}</div>`;
    }

    let minBadge = '';
    if (constraints[i]) {
      minBadge = `<div class="min-badge">${constraints[i]}</div>`;
    }

    html += `<div class="${cls}" data-index="${i}">
      ${minBadge}
      ${costBadge}
      ${renderPawns(c.red, 'red')}
      ${renderPawns(c.blue, 'blue')}
    </div>`;
  }
  board.innerHTML = html;

  board.querySelectorAll('.cell').forEach(el => {
    el.addEventListener('click', () => onCellClick(parseInt(el.dataset.index)));
  });

  renderBottomPanel();
  renderStatsFooter();
}

function renderBottomPanel() {
  const panel = document.getElementById('bottom');
  if (isGameOver()) {
    panel.innerHTML = '<button class="btn-primary" data-action="reset">Nouvelle partie</button>';
    panel.querySelector('[data-action="reset"]').addEventListener('click', () => resetGame());
    return;
  }

  if (isAITurn()) {
    panel.innerHTML = '<div class="panel-msg">Au tour de l\'IA…</div>';
    return;
  }

  if (game.selected === null) {
    panel.innerHTML = '<div class="panel-msg">Choisis une case pour jouer</div>';
    return;
  }

  const i = game.selected;
  const c = game.board[i];
  const owner = cellOwner(c);
  const cost = minCost(i, game.current, game.level);
  const max = currentStock();
  const minPlacement = LEVELS[game.level].minPlacements[i];

  let desc;
  const s = game.pending > 1 ? 's' : '';
  if (owner === other(game.current)) {
    desc = `Reprendre la case ${i+1} : ${game.pending} pion${s}. L'adversaire récupère ses pions.`;
  } else if (owner === game.current) {
    desc = `Renforcer la case ${i+1} : ${game.pending} pion${s}.`;
  } else {
    desc = `Occuper la case ${i+1} : ${game.pending} pion${s}.`;
  }
  if (minPlacement && game.pending === minPlacement && minPlacement > baseCost(c, game.current)) {
    desc += ` (minimum ${minPlacement} sur cette case)`;
  }

  panel.innerHTML = `
    <div class="panel-content">
      <div class="panel-desc">${desc}</div>
      <div class="counter">
        <button id="btn-minus" ${game.pending <= cost ? 'disabled' : ''}>−</button>
        <div class="value">${game.pending}</div>
        <button id="btn-plus" ${game.pending >= max ? 'disabled' : ''}>+</button>
      </div>
      <div class="actions">
        <button class="btn-cancel" id="btn-cancel">Annuler</button>
        <button class="btn-confirm ${game.current}" id="btn-confirm">Placer</button>
      </div>
    </div>
  `;

  document.getElementById('btn-minus').addEventListener('click', () => {
    if (game.pending > cost) { game.pending--; renderGame(); }
  });
  document.getElementById('btn-plus').addEventListener('click', () => {
    if (game.pending < max) { game.pending++; renderGame(); }
  });
  document.getElementById('btn-cancel').addEventListener('click', () => {
    game.selected = null; renderGame();
  });
  document.getElementById('btn-confirm').addEventListener('click', () => {
    performHumanMove(i, game.pending);
  });
}

function renderStatsFooter() {
  const el = document.getElementById('stats-footer');
  if (!game.vsAI) { el.innerHTML = ''; return; }
  const s = Stats.load();
  el.innerHTML = `
    <span class="item">🏆 <span class="val">${s.wins}</span> victoires</span>
    <span class="item">✕ <span class="val">${s.losses}</span> défaites</span>
    <span class="item">= <span class="val">${s.draws}</span> nulles</span>
  `;
}

// ============================================================
// INTERACTIONS
// ============================================================
function onCellClick(i) {
  if (isGameOver() || isAITurn()) return;
  const cost = minCost(i, game.current, game.level);
  if (cost > currentStock()) return;

  if (game.selected === i) {
    game.selected = null;
  } else {
    game.selected = i;
    game.pending = cost;
  }
  renderGame();
}

function performHumanMove(index, count) {
  if (isGameOver() || isAITurn()) return;
  const cost = minCost(index, game.current, game.level);
  if (count < cost || count > currentStock()) return;

  const player = game.current;
  spawnFlyingPawns(index, count, player);
  applyMove(index, count);
  renderGame();

  if (isGameOver()) {
    recordStatsIfNeeded();
    if (game.winner) setTimeout(() => showWinOverlay(game.winner), 400);
  } else if (isAITurn()) {
    setTimeout(runAITurn, 550);
  }
}

function runAITurn() {
  if (!isAITurn()) return;
  renderGame();
  setTimeout(() => {
    const move = aiChooseMove();
    if (!move) {
      // L'IA ne peut pas jouer : on lui fait passer son tour.
      // Si l'adversaire ne peut pas non plus, match nul.
      const opponentCanPlay = legalMoves({
        board: game.board.map(c => ({ ...c })),
        current: 'red',
        stock: { ...game.stock },
        level: game.level
      }).length > 0;
      if (!opponentCanPlay) {
        game.isDraw = true;
        renderGame();
        recordStatsIfNeeded();
      } else {
        game.current = 'red';
        renderGame();
      }
      return;
    }
    spawnFlyingPawns(move.cell, move.count, 'blue');
    applyMove(move.cell, move.count);
    renderGame();
    if (isGameOver()) {
      recordStatsIfNeeded();
      if (game.winner) setTimeout(() => showWinOverlay(game.winner), 400);
    } else if (isAITurn()) {
      // L'IA doit rejouer (l'adversaire est à sec)
      setTimeout(runAITurn, 550);
    }
  }, 100);
}

function recordStatsIfNeeded() {
  if (game.statsRecorded || !game.vsAI) return;
  game.statsRecorded = true;
  const s = Stats.load();
  if (game.winner === 'red') s.wins++;
  else if (game.winner === 'blue') s.losses++;
  else if (game.isDraw) s.draws++;
  Stats.save(s);
  updateMenuStats();
}

function resetGame() {
  const vsAI = game.vsAI;
  const diff = game.difficulty;
  const level = game.level;
  game = newGame(vsAI, level);
  game.difficulty = diff;
  renderGame();
  if (isAITurn()) setTimeout(runAITurn, 400);
}

// ============================================================
// NAVIGATION
// ============================================================
function showScreen(name) {
  const current = document.querySelector('.screen.active');
  const next = document.getElementById(name);
  if (!next || current === next) return;

  if (current) {
    current.classList.remove('active');
    current.classList.add('leaving');
    setTimeout(() => current.classList.remove('leaving'), 320);
  }
  next.classList.add('active');
  currentScreen = name;

  if (name === 'menu') updateMenuStats();
  if (name === 'stats') renderStatsScreen();
}

function updateMenuStats() {
  const s = Stats.load();
  document.getElementById('menu-stats-summary').textContent =
    `${s.wins} V · ${s.losses} D · ${s.draws} N`;
}

function renderStatsScreen() {
  const s = Stats.load();
  document.getElementById('stat-wins').textContent = s.wins;
  document.getElementById('stat-losses').textContent = s.losses;
  document.getElementById('stat-draws').textContent = s.draws;
  const total = s.wins + s.losses + s.draws;
  if (total > 0) {
    document.getElementById('winrate-block').style.display = 'block';
    document.getElementById('winrate-value').textContent =
      Math.round((s.wins / total) * 100) + ' %';
  } else {
    document.getElementById('winrate-block').style.display = 'none';
  }
  document.getElementById('reset-stats-btn').disabled = total === 0;
}

// ============================================================
// EVENTS
// ============================================================
document.querySelectorAll('.menu-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const action = btn.dataset.action;
    if (action === 'vsAI') {
      game = newGame(true, 1);
      document.getElementById('game-mode-label').textContent = 'Vs IA';
      document.getElementById('difficulty-picker').style.display = 'inline-flex';
      updateLevelPicker();
      updateDifficultyPicker();
      renderGame();
      showScreen('game');
    } else if (action === 'vsFriend') {
      game = newGame(false, 1);
      document.getElementById('game-mode-label').textContent = 'Vs un ami';
      document.getElementById('difficulty-picker').style.display = 'none';
      updateLevelPicker();
      renderGame();
      showScreen('game');
    } else if (action === 'stats') {
      showScreen('stats');
    }
  });
});

document.querySelectorAll('[data-action="back"]').forEach(btn => {
  btn.addEventListener('click', () => showScreen('menu'));
});

document.querySelectorAll('[data-action="reset"]').forEach(btn => {
  btn.addEventListener('click', () => resetGame());
});

document.querySelectorAll('#difficulty-picker button').forEach(btn => {
  btn.addEventListener('click', () => {
    game.difficulty = btn.dataset.diff;
    updateDifficultyPicker();
  });
});

document.querySelectorAll('#level-picker button').forEach(btn => {
  btn.addEventListener('click', () => {
    const level = parseInt(btn.dataset.level);
    if (level === game.level) return;
    game.level = level;
    game = newGame(game.vsAI, level);
    updateLevelPicker();
    renderGame();
  });
});

function updateDifficultyPicker() {
  document.querySelectorAll('#difficulty-picker button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.diff === game.difficulty);
  });
}

function updateLevelPicker() {
  document.querySelectorAll('#level-picker button').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.level) === game.level);
  });
}

const confirmOverlay = document.getElementById('confirm-overlay');
document.getElementById('reset-stats-btn').addEventListener('click', () => {
  confirmOverlay.classList.add('show');
});
document.getElementById('confirm-no').addEventListener('click', () => {
  confirmOverlay.classList.remove('show');
});
document.getElementById('confirm-yes').addEventListener('click', () => {
  Stats.reset();
  renderStatsScreen();
  updateMenuStats();
  confirmOverlay.classList.remove('show');
});

// ============================================================
// INIT
// ============================================================
updateMenuStats();
</script>
</body>
</html>
